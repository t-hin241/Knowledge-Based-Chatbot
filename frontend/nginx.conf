# ─────────────────────────────────────────────────────────────────────────────
# Nginx config for Talk2Doc frontend
#
# Handles two jobs:
#   1. Serve the built React SPA (with HTML5 history fallback)
#   2. Proxy /api/* and /docs to the FastAPI backend container
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json
                    application/javascript text/javascript
                    application/x-javascript text/xml
                    application/xml+rss image/svg+xml;

    # ── API proxy — forward to FastAPI backend ────────────────────────────
    # ^~ ensures this prefix match takes precedence over regex matches below.
    # This is critical for serving avatar images that end in .png/.jpg.
    location ^~ /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Static assets — long cache (Vite adds content hash to filenames) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # ── FastAPI docs (only available when DEBUG=True) ─────────────────────
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ── React SPA fallback — all other routes serve index.html ───────────
    # This makes React Router work on page refresh / direct URL access
    location / {
        try_files $uri $uri/ /index.html;
    }
}
